<html>
    <head lang="ru">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <title>TechAdmin</title>
    </head>
    <body>

        <nav class="navbar navbar-expand-lg bg-body-tertiary">

            <div class="container">

                <a class="navbar-brand" href="#">
                    TechAdmin
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu"
                    aria-controls="mainMenu"
                    aria-expanded="false"
                    aria-label="Открыть меню"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainMenu">

                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                Главная
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Пользователи
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Отчёты
                            </a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>

        <main class="container py-4">
            <h1>Информация</h1>

            <div class="row g-3">
                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Пользователи</h5>
                            <p class="fs-4" id="userscount">-</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Заказы</h5>
                            <p class="fs-4" id="orderCount">-</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Доход</h5>
                            <p class="fs-4" id="salaryCount">-</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Уведомление</h5>
                            <p class="fs-4" id="notificationCount">-</p>
                        </div>
                    </div>
                </div>  
            </div>

            <section id="actions" class="mt-5">
                <h2 class="mb-3">Последние действия</h2>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Пользователь</th>
                                <th>Действие</th>
                                <th>Дата</th>
                                <th>Статус</th>
                            </tr>
                        </thead>

                        <tbody id="actionTable"></tbody>

                    </table>
                </div>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/app.js"></script>

    </body>
    
</html>
